# Builds an installable Android app (APK) of the store. Run it from GitHub: Actions > "Build Android app" > Run workflow.
# The finished file appears at the bottom of the run page under "Artifacts". Nothing here needs your secret keys.
name: Build Android app
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Live website the app opens"
        default: "https://florida-united.vercel.app"
        required: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Point the app at your website
        run: node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url=process.env.SITE;c.server.allowNavigation[0]=new URL(process.env.SITE).hostname;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
        env: { SITE: "${{ inputs.site_url }}" }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: florida-kuwait-app
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
